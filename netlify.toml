# Castle Packaging website — Netlify configuration
#
# This site has no build step (plain HTML/CSS/JS) — the only reason this
# file exists is to tell Netlify where the serverless Function lives, so
# the Product Chatbot (which calls the Anthropic API from a Function
# instead of the browser, so the API key is never exposed in the site's
# own public JavaScript) works once deployed.
#
# Note: this is a SEPARATE Netlify site from the Business Suite app, so it
# needs its own copy of this file and its own environment variables — see
# netlify/functions/chat.js and chat-config.js for what to set up.

[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Note: the old "post News & Updates to Facebook/Instagram automatically"
# feature that used to run here has been replaced by the Social Media
# Campaign Manager in the Business Suite app (see social-media.html there)
# — it covers more platforms, lets you plan/review/confirm posts instead of
# blind auto-posting, and isn't tied to what's in the News & Updates
# section. Nothing scheduled runs on this site anymore.
